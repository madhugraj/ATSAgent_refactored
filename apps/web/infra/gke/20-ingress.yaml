# Public entry: www.scouts.yavar.ai (TLS by a Google-managed certificate) and
# scouts.yavar.ai, both on one global static IP. HTTP is redirected to HTTPS.
#
# Phase 9: this ingress is public, so anything it routes is externally
# reachable. The internal service API prefix /api/internal must NOT be routed
# here in production — Python services call the app over the cluster-internal
# service (scouts-app.scouts.svc.cluster.local), never through this host.
# Enforce the denial at the LB, not just in the app: a Cloud Armor security
# policy (or BackendConfig) on this ingress that denies paths under
# /api/internal/* (review 9a B1). Defence in depth: the route itself 404s any
# request that carries X-Forwarded-For while NODE_ENV=production
# (server/internal-ai.server.ts) — in-cluster callers connect directly and
# carry none.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: scouts-cert
  namespace: scouts
spec:
  domains:
    - www.scouts.yavar.ai
    - scouts.yavar.ai
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: scouts-frontend
  namespace: scouts
spec:
  redirectToHttps: { enabled: true, responseCodeName: MOVED_PERMANENTLY_DEFAULT }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scouts
  namespace: scouts
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: scouts-ip
    networking.gke.io/managed-certificates: scouts-cert
    networking.gke.io/v1beta1.FrontendConfig: scouts-frontend
spec:
  defaultBackend:
    service: { name: scouts-app, port: { number: 80 } }
