[project]
name = "ats-matching-ml-service"
version = "0.1.0"
description = "ATSAgent matching-ml service (Phase 9b shadow): the deterministic scoring half — experience band, career maths, blends, weighted roll-up. Scores only; gates stay in TS."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.8", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# career.py mirrors the TS parity strings verbatim (flags/notes are contract);
# wrapping them would break string-level parity.
"app/career.py" = ["E501"]
"tests/test_scoring_parity.py" = ["E501"]
