[project]
name = "ats-analytics-ml-service"
version = "0.1.0"
description = "ATSAgent analytics-ml service (Phase 9b shadow): selection-rate parity (four-fifths), pool coverage, demand outlook — deterministic, advisory-only."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.8", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.ruff.lint.per-file-ignores]
# Verbatim TS parity strings and long formula assertions must not be altered.
"app/analytics.py" = ["E501"]
"tests/test_analytics_parity.py" = ["E501"]
