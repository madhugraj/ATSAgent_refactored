# Extend the default rules; nothing is relaxed except the dummy credentials
# in the CI worker-boot smoke step (phase-2 review B1's required smoke uses
# literal dummy env values that the generic-api-key rule flags).
[extend]
useDefault = true

[allowlist]
description = "dummy worker-smoke credentials in .github/workflows/ci.yml — not real secrets"
paths = ['''\.github/workflows/ci\.yml$''']
regexes = ['''(SESSION_SECRET|SIP_PASSWORD|PARSER_TOKEN)=([a-z0-9][a-z0-9-]{2,})''']
