name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token (apps/web/docs/guardrails.md P2-3).
permissions:
  contents: read
  pull-requests: read

jobs:
  python-services:
    # Phase 9 parallel track: quality gate for services/* (the template for now).
    # Python quality is owned here, NOT by turborepo — a package.json shim under
    # services/* would make bun workspaces try to install it (decision in
    # services/_template/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Match packageManager (root package.json) so lockfile formats cannot drift.
          bun-version: 1.3.14
      # The contract generator imports the zod schemas (bun runs TS).
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Install uv
        # Version-pinned like the other actions; same version as local dev.
        run: curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh
      - name: Sync template service
        working-directory: services/_template
        run: uv sync --locked
      - name: Lint (ruff)
        working-directory: services/_template
        run: uv run ruff check app tests
      - name: Types (mypy strict)
        working-directory: services/_template
        run: uv run mypy app
      - name: Tests (pytest)
        working-directory: services/_template
        run: uv run pytest -q
      - name: Contract drift check
        run: bun tools/contracts/generate.mjs --check

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14 # same major as production (Cloud SQL POSTGRES_14)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atsiq_ci
        ports: ["54333:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54333/atsiq_ci
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Match packageManager (root package.json) so lockfile formats cannot drift.
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check (turbo, per package)
        run: bunx turbo run typecheck
      - name: Lint (app + scripts)
        run: bun run lint
      - name: Format check
        run: bunx prettier --check .
      - name: Dependency audit (high+ blocks)
        run: bun audit --audit-level=high
        continue-on-error: false
      # Full-history scan: the action's push-event partial scan breaks when
      # the range start is a rewritten or absent commit (force-push, history
      # rewrite) — it exits 1 with "unknown revision" before finding anything.
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          log-opts: --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # table-owners runs here; graph+inventory run locally against the source
      # checkout (they map source paths, which don't exist in this repo).
      - name: Refactor invariants (every table owned)
        run: node scripts/refactor/table-owners.mjs
      - name: Dependency rules (depcruise ratchet, review C3)
        run: node tools/depcruise-check.mjs
      - name: Apply database schema
        run: node packages/db/scripts/migrate-pg.mjs

      # Package unit tests (packages/*/test), via each package's own script.
      - name: Package tests (turbo)
        run: bunx turbo run test
      # One bun process per file: bun's mock.module is process-global, so a
      # combined `bun test scripts/` run would leak one file's mocks into
      # every later file (empty agent registry, fake db).
      - name: Tests (every scripts/*.test.ts, one bun process per file)
        # Collect every failing file instead of stopping at the first, so one
        # CI run shows the full failure set.
        run: |
          fails=""
          for f in scripts/*.test.ts; do bun test "$f" || fails="$fails $f"; done
          if [ -n "$fails" ]; then echo "failed test files:$fails"; exit 1; fi
      - name: Agents lock matches manifests
        run: bun run agents:lock && git diff --exit-code scripts/agents.lock.json
      - name: Build (turbo)
        run: bunx turbo run build

      # The prod image copies only .output — no node_modules — so the worker
      # bundles must boot on their own (phase-2 review B1). Copy them into
      # bare directories, start with dummy env, and require the health line.
      # The prod image and the dev module-runner resolve imports differently;
      # the dev server must boot and serve without module-resolution errors
      # (phase-4 find: workspace @db imports 500'd every route in dev only).
      - name: Web dev boot smoke
        run: |
          cd apps/web
          # PORT pinned + generous wait: the cold dependency optimizer on a
          # fresh CI runner can take well over a minute before the port binds.
          (PORT=3000 DATABASE_URL="$DATABASE_URL" SESSION_SECRET="$SESSION_SECRET" \
            bun run dev > /tmp/vite-dev-ci.log 2>&1 &)
          code=000
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / -> $code"
          [ "$code" = "200" ] || { echo "dev server did not serve /"; tail -40 /tmp/vite-dev-ci.log; exit 1; }
          if grep -qE "Cannot find module|ERR_MODULE_NOT_FOUND|ERR_PACKAGE_IMPORT_NOT_DEFINED" /tmp/vite-dev-ci.log; then
            echo "module-resolution errors in dev:"; grep -E "Cannot find module|ERR_MODULE" /tmp/vite-dev-ci.log; exit 1
          fi
          pkill -f "vite dev" || true

      - name: Worker boot smoke (no node_modules)
        run: bash scripts/worker-boot-smoke.sh
